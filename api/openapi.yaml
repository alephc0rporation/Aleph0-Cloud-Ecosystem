openapi: 3.0.3
info:
  title: Aleph0 Cloud Ecosystem API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: The API and its database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me:
    get:
      operationId: getMe
      summary: The user the access token belongs to
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          description: Keycloak subject (the token's `sub` claim).
        email:
          type: string
        name:
          type: string
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
