regions:
  get:
    operationId: listRegions
    summary: Regions where resources can be created
    responses:
      '200':
        description: Every region.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../components/schemas.yaml#/Region
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
