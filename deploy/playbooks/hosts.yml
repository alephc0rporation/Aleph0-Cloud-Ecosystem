# Waits for every node and lists all nodes in every node's /etc/hosts, so a new node is known
# everywhere. Kolla's own /etc/hosts handling is off (customize_etc_hosts: no).
- name: Prepare the nodes
  hosts: all:!localhost
  gather_facts: false
  become: true
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600

    # Exit code 2: done, with recoverable errors (degraded); the node is usable.
    - name: Wait for cloud-init on VMs
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]
      when: vm is defined

    - name: Drop the 127.0.1.1 hostname line (Kolla needs the hostname on the management IP)
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent

    - name: List every node
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} aleph0 nodes"
        block: |
          {% for h in groups['all'] | difference(['localhost']) | sort %}
          {{ hostvars[h].ansible_host }} {{ h }}
          {% endfor %}

    # A safety net for the RAM-tight dev VMs: a bad moment gets slow instead of OOM-killing Ceph.
    - name: Add a 2 GB swap file on VMs
      when: vm is defined
      block:
        # Built under another name, so an interrupted run never leaves an unformatted /swapfile.
        - name: Create /swapfile if missing
          ansible.builtin.shell: |
            set -e
            rm -f /swapfile.new
            fallocate -l 2G /swapfile.new
            chmod 600 /swapfile.new
            mkswap /swapfile.new
            mv /swapfile.new /swapfile
          args:
            creates: /swapfile

        - name: Mount /swapfile at boot
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^/swapfile\s'
            line: /swapfile none swap sw 0 0

        - name: List active swap
          ansible.builtin.command: swapon --show=NAME --noheadings
          register: swaps
          changed_when: false

        - name: Enable /swapfile
          ansible.builtin.command: swapon /swapfile
          when: "'/swapfile' not in swaps.stdout_lines"
